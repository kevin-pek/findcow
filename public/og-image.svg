<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fde68a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern (decorative) -->
  <g opacity="0.1">
    <rect x="50" y="150" width="80" height="80" rx="10" fill="#000"/>
    <rect x="140" y="150" width="80" height="80" rx="10" fill="#000"/>
    <rect x="230" y="150" width="80" height="80" rx="10" fill="#000"/>
    <rect x="50" y="240" width="80" height="80" rx="10" fill="#000"/>
    <rect x="140" y="240" width="80" height="80" rx="10" fill="#000"/>
    <rect x="230" y="240" width="80" height="80" rx="10" fill="#000"/>
    <rect x="50" y="330" width="80" height="80" rx="10" fill="#000"/>
    <rect x="140" y="330" width="80" height="80" rx="10" fill="#000"/>
    <rect x="230" y="330" width="80" height="80" rx="10" fill="#000"/>
  </g>

  <!-- Cute Cow Face -->
  <g transform="translate(750, 280)">
    <!-- Face -->
    <ellipse cx="0" cy="0" rx="140" ry="120" fill="#fff" stroke="#333" stroke-width="4"/>

    <!-- Spots -->
    <ellipse cx="-60" cy="-40" rx="35" ry="30" fill="#333"/>
    <ellipse cx="50" cy="20" rx="25" ry="20" fill="#333"/>

    <!-- Ears -->
    <ellipse cx="-130" cy="-60" rx="40" ry="25" fill="#ffb6c1" stroke="#333" stroke-width="3" transform="rotate(-20 -130 -60)"/>
    <ellipse cx="130" cy="-60" rx="40" ry="25" fill="#ffb6c1" stroke="#333" stroke-width="3" transform="rotate(20 130 -60)"/>

    <!-- Horns -->
    <path d="M-100,-100 Q-110,-150 -80,-140" stroke="#f5deb3" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M100,-100 Q110,-150 80,-140" stroke="#f5deb3" stroke-width="15" fill="none" stroke-linecap="round"/>

    <!-- Eyes -->
    <ellipse cx="-45" cy="-20" rx="20" ry="25" fill="#fff" stroke="#333" stroke-width="3"/>
    <ellipse cx="45" cy="-20" rx="20" ry="25" fill="#fff" stroke="#333" stroke-width="3"/>
    <circle cx="-45" cy="-15" r="10" fill="#333"/>
    <circle cx="45" cy="-15" r="10" fill="#333"/>
    <circle cx="-42" cy="-20" r="4" fill="#fff"/>
    <circle cx="48" cy="-20" r="4" fill="#fff"/>

    <!-- Snout -->
    <ellipse cx="0" cy="50" rx="60" ry="40" fill="#ffb6c1" stroke="#333" stroke-width="3"/>

    <!-- Nostrils -->
    <ellipse cx="-20" cy="50" rx="10" ry="12" fill="#333"/>
    <ellipse cx="20" cy="50" rx="10" ry="12" fill="#333"/>

    <!-- Smile -->
    <path d="M-25,75 Q0,95 25,75" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="420" y="220" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#1f2937" text-anchor="middle">Find the</text>
  <text x="420" y="320" font-family="Arial, sans-serif" font-size="100" font-weight="bold" fill="#d97706" text-anchor="middle">COW</text>

  <!-- Subtitle -->
  <text x="420" y="400" font-family="Arial, sans-serif" font-size="32" fill="#6b7280" text-anchor="middle">Daily Word Search Puzzle</text>

  <!-- COW letters highlight -->
  <g transform="translate(280, 450)">
    <rect x="0" y="0" width="70" height="70" rx="10" fill="#f59e0b"/>
    <text x="35" y="52" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#fff" text-anchor="middle">C</text>

    <rect x="80" y="0" width="70" height="70" rx="10" fill="#f59e0b"/>
    <text x="115" y="52" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#fff" text-anchor="middle">O</text>

    <rect x="160" y="0" width="70" height="70" rx="10" fill="#f59e0b"/>
    <text x="195" y="52" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#fff" text-anchor="middle">W</text>
  </g>

  <!-- Daily badge -->
  <g transform="translate(1050, 80)">
    <circle cx="0" cy="0" r="60" fill="#10b981"/>
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">NEW</text>
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">DAILY</text>
  </g>
</svg>
